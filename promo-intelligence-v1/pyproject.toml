[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "promo-intelligence"
version = "0.1.0"
description = "Standalone promotion evidence discovery and normalization prototype"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
promo-intel = "promo_intelligence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
